name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - ops

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: SSH into EC2 instance and prepare for deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            # Ensure Docker and docker-compose are ready
            docker --version
            docker-compose --version
          EOF

      - name: Copy source to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -o StrictHostKeyChecking=no -r . $EC2_USER@$EC2_HOST:/home/ubuntu/projects/awtsyde-notification-service

      - name: Execute Docker commands on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            ls
            echo "success"

            # # Stop existing containers
            # docker-compose down
            
            # # Clean up unused Docker resources
            # docker system prune -af

            # # Build and start containers in detached mode
            # docker-compose up --build -d
          EOF
